<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}NexusQuery{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <!-- Bootstrap 5 dark -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <style>
    :root {
      --nq-bg:        #0b0e14;
      --nq-surface:   #111620;
      --nq-card:      #161c2a;
      --nq-border:    #1f2b42;
      --nq-accent:    #00d4ff;
      --nq-accent2:   #7b5ef8;
      --nq-warn:      #ff6b35;
      --nq-text:      #c9d4e8;
        --nq-muted: #c9d4e8;
        --nq-mono:      'Space Mono', monospace;
      --nq-sans:      'DM Sans', sans-serif;
    }
    body {
      background: var(--nq-bg);
      color: var(--nq-text);
      font-family: var(--nq-sans);
      font-size: 15px;
    }
    /* Navbar */
    .nq-navbar {
      background: rgba(11,14,20,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--nq-border);
    }
    .nq-brand {
      font-family: var(--nq-mono);
      font-size: 1.1rem;
      color: var(--nq-accent) !important;
      letter-spacing: 0.05em;
    }
    .nq-brand span { color: var(--nq-accent2); }
    .nav-link { color: var(--nq-muted) !important; font-weight: 500; transition: color 0.2s; }
    .nav-link:hover, .nav-link.active { color: var(--nq-accent) !important; }

    /* Utility */
    .accent   { color: var(--nq-accent); }
    .accent2  { color: var(--nq-accent2); }
    .mono     { font-family: var(--nq-mono); }
    .muted    { color: var(--nq-muted); }
    .card-nq  {
      background: var(--nq-card);
      border: 1px solid var(--nq-border);
      border-radius: 12px;
    }
    .badge-accent {
      background: rgba(0,212,255,0.12);
      color: var(--nq-accent);
      border: 1px solid rgba(0,212,255,0.25);
      font-family: var(--nq-mono);
      font-size: 0.72rem;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg nq-navbar sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand nq-brand" href="/">NEXUS<span>QUERY</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <i class="bi bi-list text-light fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ms-auto gap-2">
        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'home.index' %}active{% endif %}" href="/">Overview</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'home.chatbot' %}active{% endif %}" href="/chatbot">
          <i class="bi bi-chat-dots me-1"></i>Chat
        </a></li>
      <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'home.architecture' %}active{% endif %}"
             href="/architecture">
            <i class="bi bi-diagram-3 me-1"></i>Architecture
          </a>
      </li>
        <li class="nav-item"><a class="nav-link" href="/health/"><i class="bi bi-heart-pulse me-1"></i>Health</a></li>
      </ul>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="mt-5 py-4" style="border-top:1px solid var(--nq-border);">
  <div class="container text-center muted" style="font-size:0.8rem;">
    <span class="mono">NexusQuery</span> · Azure Databricks + Anthropic Claude · POC Build
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
